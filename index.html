    <link rel="stylesheet" href="css/styles.css">
    <style>
        img {
            width: 100%;
            max-width: 500;
        }
        p {
            font-size: 18px;
        }
        body {
            margin: 0;
            padding: 0;
            max-width: 100%;
            max-height: 100%;
            overflow-x: hidden;
        }

        /* 1. Banner Container */
        .wavy-banner {
            position: relative;
            width: 100%;
            height: 120px; /* Adjust height as needed */
            background: #1E1E1E; /* Base banner background color */
        }

        /* 2. Content Layer */
        .banner-content {
            position: relative;
            z-index: 2;
            top: 35px;
            display: flex;
            justify-content: center;
            text-align: center;
            align-items: center;
            height: 70px; /* Keeps text above the wave */
            color: white;
            font-family: sans-serif;
            font-weight: bold;
        }

        /* 3. The Looping Wave Layer */
        .wave-wrapper {
            position: absolute;
            top: 100%;
            left: 0;
            width: 200%; /* Must be at least 200% for a seamless loop */
            height: 50px; /* Height of the wave animation */
            /* Seamless SVG wave code embedded as background */
            background-image: url('images/banner.png');
            
            background-repeat: repeat-x;
            background-size: 50% 100%; /* Matches the 200% width wrapper */
            animation: move-wave 10s linear infinite;
        }
        /* 3. The Looping Wave Layer */
        .wave-wrapper-2 {
            position: absolute;
            top: 100%;
            left: 0;
            width: 200%; /* Must be at least 200% for a seamless loop */
            height: 54px; /* Height of the wave animation */
            /* Seamless SVG wave code embedded as background */
            background-image: url('images/white_banner.png');
            
            background-repeat: repeat-x;
            background-size: 50% 100%; /* Matches the 200% width wrapper */
            animation: move-wave 10s linear infinite;
        }

        /* Container holding the parallax area */
        .parallax-container {
            z-index: -1;
            width: 100%;
            height: 600px;
        }

        /* The actual background image layer */
        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130%; /* Make it taller so it doesn't leave gaps when moving */
            background-image: url('images/howlingturnpikeblur.png');
            background-size: cover;
            background-position: center;
            will-change: transform; /* Optimizes browser rendering speed */
        }

        /* Foreground content text layer */
        .parallax-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 4. Infinite Loop Animation */
        @keyframes move-wave {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(-50%); /* Moves exactly one full pattern width */
        }
        }

    </style>
</head>
